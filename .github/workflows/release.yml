name: release

# Push a tag like v0.4.0 (after setting that version in pyproject.toml and src/proofloop/__init__.py,
# and its section in CHANGELOG.md): CI's checks run, then a GitHub release is made with the
# changelog section as its notes and the built package attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The tag, the version and the changelog agree
        run: |
          python -m pip install -e . -c constraints.txt
          v="$(python -c 'import proofloop; print(proofloop.__version__)')"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but the version is $v"; exit 1; }
          python -m proofloop.core.changelog "$v" > notes.md
      - name: Tests
        run: |
          python -m pip install -e ".[all,dev]" -c constraints.txt
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "ProofLoop ${GITHUB_REF_NAME#v}" --notes-file notes.md
