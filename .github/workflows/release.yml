name: release

# Push a tag like v0.4.0 (after setting that version in pyproject.toml and src/proofloop/__init__.py,
# and its section in CHANGELOG.md): CI's checks run, the Python package and the Windows installer
# (no Python needed) are built, then a GitHub release is made with the changelog section as its notes
# and both attached. If the repository variable PUBLISH_TO_PYPI is "true", publish.yml then uploads
# the package to PyPI.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: The tag, the version and the changelog agree
        run: |
          python -m pip install -e . -c constraints.txt
          v="$(python -c 'import proofloop; print(proofloop.__version__)')"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but the version is $v"; exit 1; }
          python -m proofloop.core.changelog "$v" > notes.md
      - name: Tests
        run: |
          python -m pip install -e ".[all,dev]" -c constraints.txt
          python -m pytest -q
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: |
            dist/*
            notes.md

  windows:
    name: Windows installer
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: PyInstaller
        run: |
          python -m pip install ".[all]" pyinstaller==6.22.3 -c constraints.txt
          pyinstaller packaging/windows/proofloop.spec --noconfirm --distpath dist --workpath build/pyinstaller
      - name: The program runs without Python
        shell: pwsh
        run: |
          $env:PROOFLOOP_HOME = Join-Path $env:RUNNER_TEMP "proofloop-home"
          function Run($exe, $ok, $arguments) {
              & $exe @arguments
              if ($ok -notcontains $LASTEXITCODE) { throw "$exe $arguments exited with $LASTEXITCODE" }
          }
          $exe = "dist\ProofLoop\proofloop.exe"
          Run $exe @(0) @("--version")
          Run $exe @(0, 1) @("doctor", "--json")   # 1 = something to look at, 2 = couldn't run
          Run $exe @(0) @("check", "examples\gcode\bracket_good.gcode", "--json")
          Run $exe @(0) @("loop", "check", "examples\gcode\FL_S2_bracket_plate.gcode.3mf", "--json")
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
              choco install innosetup -y --no-progress
              if ($LASTEXITCODE -ne 0) { throw "couldn't install Inno Setup" }
          }
          $version = python -c "import proofloop; print(proofloop.__version__)"
          & $iscc "/DAppVersion=$version" "/DIconFile=$PWD\build\pyinstaller\proofloop.ico" packaging\windows\proofloop.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - name: The installer installs, runs and uninstalls (for this user, no admin)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem dist\installer\ProofLoop-Setup-*.exe).FullName
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=desktopicon" -Wait
          $app = Join-Path $env:LOCALAPPDATA "Programs\ProofLoop"
          foreach ($f in "proofloop.exe", "ProofLoopApp.exe", "unins000.exe") {
              if (-not (Test-Path (Join-Path $app $f))) { throw "$f was not installed in $app" }
          }
          & (Join-Path $app "proofloop.exe") --version
          if ($LASTEXITCODE -ne 0) { throw "the installed proofloop.exe failed" }
          Start-Process (Join-Path $app "unins000.exe") -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait
          Start-Sleep -Seconds 3
          if (Test-Path (Join-Path $app "proofloop.exe")) { throw "the uninstaller left proofloop.exe behind" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: dist/installer/ProofLoop-Setup-*.exe

  release:
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # to start publish.yml
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: installer
      - name: Release
        run: |
          (cd installer && sha256sum ProofLoop-Setup-*.exe) > SHA256SUMS.txt
          (cd dist && sha256sum *) >> SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" dist/* installer/ProofLoop-Setup-*.exe SHA256SUMS.txt \
            --title "ProofLoop ${GITHUB_REF_NAME#v}" --notes-file notes.md
      - name: PyPI
        # A release made with the workflow's own token doesn't start other workflows, so start it here.
        if: vars.PUBLISH_TO_PYPI == 'true'
        run: gh workflow run publish.yml --ref "$GITHUB_REF_NAME" -f target=pypi
