name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  clearloop:
    # ClearLoop on its own: it must keep working without synthux installed.
    name: clearloop / py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: packages/clearloop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests tools
      - run: pytest -q

  clearloop-evidence:
    # Re-check the built-in P2S profile against the public FarmLoop files it was learned from.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/clearloop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: |
          git clone https://github.com/Liaminamerica2/p2s-autofarm-playbook /tmp/playbook
          git -C /tmp/playbook checkout 7b9a988963bf152c3839344d441e82bdcd96b924
      - run: CLEARLOOP_EVIDENCE=/tmp/playbook/evidence pytest -q tests/test_evidence.py

  synthux-alone:
    # synthux without ClearLoop: everything but loop files must still work.
    name: synthux alone / py3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/synthux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" ruff
      - run: ruff check --select F,E9 src tests
      - run: python -m pytest tests/unit -q

  together:
    # ProofLoop as setup.bat installs it: synthux, ClearLoop and the ProofLoop window in one
    # environment, so the features that join them (loop files in synthux, print checks and print
    # history in ClearLoop, plates handed between them in the window) run for real.
    name: together / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ProofLoop
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/synthux[dev,anthropic]" -e "packages/clearloop[dev]" -e "packages/proofloop[dev]"
          python -m playwright install chromium
      - name: ProofLoop tests (one window, plates handed both ways)
        working-directory: packages/proofloop
        run: |
          ruff check src tests
          python -m pytest -q
      - name: ClearLoop tests (with synthux's print checks)
        working-directory: packages/clearloop
        run: python -m pytest -q
      - name: synthux unit tests (with ClearLoop's loop files)
        working-directory: packages/synthux
        run: python -m pytest tests/unit -q
      - name: Text files are read and written as UTF-8 (Windows defaults to another encoding)
        if: runner.os == 'Linux'
        working-directory: packages/synthux
        run: python -X warn_default_encoding -m pytest tests/unit -q -W "error::EncodingWarning:synthux" -W "error::EncodingWarning:tests"
      - name: synthux browser integration tests
        working-directory: packages/synthux
        run: python -m pytest tests/integration -q
      - name: synthux end-to-end (demo shop + CAD example)
        working-directory: packages/synthux
        run: python -m pytest tests/e2e -q
      - name: CLI smoke test from the repository root
        run: |
          synthux check
          synthux run packages/synthux/studies/demo.yaml --dry-run
          synthux physical gcode packages/synthux/examples/gcode/bracket_good.gcode.3mf
          proofloop check packages/synthux/examples/gcode/bracket_good.gcode.3mf
          proofloop clearloop profiles
          proofloop --help

  windows-setup-script:
    name: windows / setup.bat
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the one-step setup script
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup_windows.ps1
      - name: Use the installed tools
        shell: pwsh
        run: |
          $ex = "packages\synthux\examples"
          .\.venv\Scripts\synthux.exe physical check $ex\cad\phone_stand_v1.stl --design $ex\cad\phone_stand.yaml
          .\.venv\Scripts\synthux.exe physical printed "Phone stand" --measure $ex\cad\v1_print_measurements.csv --defect poor_overhang
          .\.venv\Scripts\synthux.exe physical check $ex\cad\phone_stand_v2.stl --design $ex\cad\phone_stand.yaml
          .\.venv\Scripts\synthux.exe physical history
          .\.venv\Scripts\synthux.exe physical gcode $ex\gcode\bracket_flawed.gcode
          .\.venv\Scripts\proofloop.exe check $ex\gcode\bracket_plate.gcode.3mf
          .\.venv\Scripts\proofloop.exe clearloop profiles
          if (-not (Test-Path ([IO.Path]::Combine([Environment]::GetFolderPath("Desktop"), "ProofLoop.lnk")))) { Write-Host "no ProofLoop shortcut"; exit 1 }
          $startup = [IO.Path]::Combine([Environment]::GetFolderPath("Startup"), "ProofLoop.lnk")
          if (-not (Test-Path $startup)) { Write-Host "ProofLoop won't start at login"; exit 1 }
          .\.venv\Scripts\proofloop.exe doctor; if ($LASTEXITCODE -gt 1) { exit 1 }
          $global:LASTEXITCODE = 0   # 1 = things to look at (no printers on a CI machine), not a failure
      - name: ProofLoop starts in the background like the shortcut, and stops cleanly
        shell: pwsh
        run: |
          # The shortcut runs pythonw -m proofloop: it starts the background service and returns.
          .\.venv\Scripts\proofloop.exe --no-window
          if ($LASTEXITCODE) { Get-Content $HOME\.proofloop\proofloop.log -ErrorAction SilentlyContinue; exit 1 }
          $r = Invoke-RestMethod http://127.0.0.1:8600/proofloop/ping
          if (-not ($r.synthux -and $r.clearloop -and $r.background)) { Write-Host "not both apps"; exit 1 }
          $page = (Invoke-WebRequest http://127.0.0.1:8600/ -UseBasicParsing).Content
          if ($page -notmatch "Loop files") { exit 1 }
          .\.venv\Scripts\proofloop.exe --no-window   # a second double-click: no second copy
          .\.venv\Scripts\proofloop.exe status
          .\.venv\Scripts\proofloop.exe stop
          if (Test-Path $HOME\.proofloop\running.json) { Write-Host "didn't stop cleanly"; exit 1 }
          try { Invoke-RestMethod http://127.0.0.1:8600/proofloop/ping -TimeoutSec 3; Write-Host "still running"; exit 1 } catch { Write-Host "stopped" }

  windows-no-python:
    name: windows / setup.bat on a PC without Python (uv)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the setup script, made to fetch its own Python
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup_windows.ps1 -ForceUv
      - name: Use the installed tools
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 12)"
          .\.venv\Scripts\synthux.exe physical gcode packages\synthux\examples\gcode\bracket_flawed.gcode
          .\.venv\Scripts\proofloop.exe clearloop --help
          if (-not (Test-Path ([IO.Path]::Combine([Environment]::GetFolderPath("Desktop"), "ProofLoop.lnk")))) { exit 1 }

  real-slicer:
    # The STL -> slice -> verdict path with a real slicer, which isn't available where ProofLoop is
    # developed: OrcaSlicer (portable) and Bambu Studio (installed silently) on Windows.
    name: real slicer / ${{ matrix.slicer }}
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        slicer: [orca, bambu]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ProofLoop
        run: python -m pip install -e "packages/synthux[dev]" -e "packages/clearloop[dev]" -e "packages/proofloop[dev]"
      - name: Download the slicer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "proofloop-ci" }
          if ("${{ matrix.slicer }}" -eq "orca") {
            $rel = Invoke-RestMethod https://api.github.com/repos/OrcaSlicer/OrcaSlicer/releases/latest -Headers $h
            $asset = $rel.assets | Where-Object { $_.name -match "Windows.*portable.*\.zip$" -and $_.name -notmatch "arm64" } | Select-Object -First 1
            if (-not $asset) { $rel.assets | ForEach-Object { $_.name }; throw "no portable Windows build in $($rel.tag_name)" }
            Write-Host "OrcaSlicer $($rel.tag_name): $($asset.name)"
            Invoke-WebRequest $asset.browser_download_url -OutFile orca.zip
            Expand-Archive orca.zip -DestinationPath C:\slicer
            $exe = Get-ChildItem C:\slicer -Recurse -Filter orca-slicer.exe | Select-Object -First 1
          } else {
            $rel = Invoke-RestMethod https://api.github.com/repos/bambulab/BambuStudio/releases/latest -Headers $h
            $asset = $rel.assets | Where-Object { $_.name -match "win.*\.exe$" -and $_.name -notmatch "arm64" } | Select-Object -First 1
            if (-not $asset) { $rel.assets | ForEach-Object { $_.name }; throw "no Windows installer in $($rel.tag_name)" }
            Write-Host "Bambu Studio $($rel.tag_name): $($asset.name)"
            Invoke-WebRequest $asset.browser_download_url -OutFile bambu-setup.exe
            Start-Process .\bambu-setup.exe -ArgumentList "/S" -Wait
            $exe = Get-ChildItem "$env:ProgramFiles\Bambu Studio" -Recurse -Filter bambu-studio.exe | Select-Object -First 1
          }
          if (-not $exe) { throw "the slicer program wasn't found after installing" }
          "SYNTHUX_SLICER=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: STL to print-ready verdict, with a loop file, and the slicer-setting fixes applied
        working-directory: packages/synthux
        run: |
          synthux physical prepare examples/cad/phone_stand_v1.stl --design examples/cad/phone_stand.yaml --loops 2
          if ($LASTEXITCODE) { exit 1 }
          synthux physical prepare examples/cad/block_control.stl --fix
      - name: The setup check finds it and slices a test part
        run: proofloop doctor --slice-test
      - name: What the slicer said (when it failed)
        if: failure()
        shell: pwsh
        run: |
          $presets = Get-ChildItem packages\synthux\data -Recurse -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path (Join-Path $_.FullName "machine.json") } | Select-Object -First 1
          if (-not $presets) { Write-Host "no presets were written"; exit 0 }
          foreach ($k in "machine", "process", "filament") {
            $j = Get-Content (Join-Path $presets.FullName "$k.json") -Raw | ConvertFrom-Json
            Write-Host "$k : name=$($j.name) from=$($j.from) inherits=$($j.inherits) compatible_printers=$($j.compatible_printers -join ', ')"
          }
          $out = "$env:RUNNER_TEMP\slice-debug"; New-Item -ItemType Directory -Force $out | Out-Null
          $m = Join-Path $presets.FullName "machine.json"; $p = Join-Path $presets.FullName "process.json"; $f = Join-Path $presets.FullName "filament.json"
          & $env:SYNTHUX_SLICER --debug 4 --slice 0 --export-3mf "$out\t.gcode.3mf" --load-settings "$m;$p" --load-filaments $f --arrange 1 --outputdir $out packages\synthux\examples\cad\block_control.stl 2>&1 | Select-Object -Last 80
          Write-Host "exit: $LASTEXITCODE"
          if (Test-Path "$out\result.json") { Get-Content "$out\result.json" }
          exit 0
