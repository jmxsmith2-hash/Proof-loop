name: publish

# Uploads the package to PyPI with Trusted Publishing: no API token is stored anywhere. The one-time
# setup on pypi.org is in docs/development.md (Releases).
#
# - A release is published (and the repository variable PUBLISH_TO_PYPI is "true"): upload to PyPI.
#   release.yml starts this itself, because a release made by a workflow doesn't start workflows.
# - Run workflow (Actions tab): pick testpypi (the default) to try it out, or pypi.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Where to upload
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build once
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: A release's tag and the version agree
        if: github.ref_type == 'tag'
        run: |
          python -m pip install dist/*.whl
          v="$(python -c 'import proofloop; print(proofloop.__version__)')"
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but the version is $v"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package
          path: dist/

  pypi:
    needs: build
    if: (github.event_name == 'release' && vars.PUBLISH_TO_PYPI == 'true') || (github.event_name == 'workflow_dispatch' && inputs.target == 'pypi')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/proofloop/
    permissions:
      id-token: write   # the short-lived token PyPI trusts; nothing is stored
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/proofloop/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
