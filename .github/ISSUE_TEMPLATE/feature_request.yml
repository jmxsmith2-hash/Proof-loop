name: Feature request
description: Suggest something ProofLoop should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What do you do now, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like ProofLoop to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you tried or considered
