# Study against the second demo site (python demo_app/pinecone.py, port 8766).
name: pinecone
target:
  url: http://127.0.0.1:8766
  credentials: {password: "${DEMO_PASSWORD:-demo-pass}"}
tasks:
  - id: returns
    type: find
    goal: Find out how many days you have to return an item
    start: /
    success_text: ["30 days to return"]
  - id: store_hours
    type: find
    goal: Find your nearest store's opening hours
    start: /
    success_text: ["Opening hours"]
    keywords: ["stores", "store locator", "opening hours", "contact"]
  - id: register
    goal: Create an account
    start: /register
    success_text: ["Welcome to Pinecone"]
    keywords: ["create account"]
    inputs:
      full_name: Alex Kim
      email: alex.kim@example.test
      country: Germany
      password: "{{cred:password}}"
      agree: "yes"
  - id: contact_email
    type: find
    goal: Find the customer support email address
    start: /
    success_text: ["support@pinecone.test"]
personas:
  count: 6
  sources: [survey.csv, reviews.txt, interview_notes.md]  # next to the studies folder
repeats: 3
