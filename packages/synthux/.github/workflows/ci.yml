name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,anthropic]"
          python -m playwright install chromium
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Text files are read and written as UTF-8 (Windows defaults to another encoding)
        if: runner.os == 'Linux'
        run: python -X warn_default_encoding -m pytest tests/unit -q -W "error::EncodingWarning:synthux" -W "error::EncodingWarning:tests"
      - name: Browser integration tests
        run: python -m pytest tests/integration -q
      - name: End-to-end (demo shop + CAD example)
        run: python -m pytest tests/e2e -q
      - name: CLI smoke test
        run: |
          synthux check
          synthux run studies/demo.yaml --dry-run
          synthux physical gcode examples/gcode/bracket_good.gcode.3mf

  windows-setup-script:
    name: windows / setup.bat path
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the one-step setup script
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup_windows.ps1
      - name: Use the installed tool
        shell: pwsh
        run: |
          .\.venv\Scripts\synthux.exe physical check examples\cad\phone_stand_v1.stl --design examples\cad\phone_stand.yaml
          .\.venv\Scripts\synthux.exe physical printed "Phone stand" --measure examples\cad\v1_print_measurements.csv --defect poor_overhang
          .\.venv\Scripts\synthux.exe physical check examples\cad\phone_stand_v2.stl --design examples\cad\phone_stand.yaml
          .\.venv\Scripts\synthux.exe physical history
          .\.venv\Scripts\synthux.exe physical gcode examples\gcode\bracket_flawed.gcode

  windows-no-python:
    name: windows / setup.bat on a PC without Python (uv)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run the setup script, made to fetch its own Python
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\setup_windows.ps1 -ForceUv
      - name: Use the installed tool
        shell: pwsh
        run: |
          .\.venv\Scripts\python.exe -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 12)"
          .\.venv\Scripts\synthux.exe physical gcode examples\gcode\bracket_flawed.gcode
          if (-not (Test-Path ([IO.Path]::Combine([Environment]::GetFolderPath("Desktop"), "Synthux.lnk")))) { exit 1 }
