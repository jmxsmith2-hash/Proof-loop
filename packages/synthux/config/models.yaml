# Model names and prices. Swap freely. Prices are USD per million tokens.
anthropic:
  roles:
    actor: claude-haiku-5-5       # cheap: one call per browser step
    persona: claude-haiku-5-5     # cheap: persona writing, questionnaires
    judge: claude-opus-5-5        # strong: reviewing issues, replay checks
    grouper: claude-opus-5-5      # strong: merging duplicate issues
    reporter: claude-opus-5-5     # strong: report and calibration text
  prices:
    claude-haiku-5-5: {input: 0.10, output: 0.50}
    claude-sonnet-5-5: {input: 2.00, output: 10.00}
    claude-opus-5-5: {input: 4.00, output: 20.00}

