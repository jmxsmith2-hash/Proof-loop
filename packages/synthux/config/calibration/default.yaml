# Simulator parameters that calibration against real users adjusts.
# Every run stores the version of this profile it used.
version: default
patience:
  base_steps: 14                 # step budget for a persona with patience 3
  steps_per_patience_point: 5    # +/- per patience point
  min_steps: 6
  retries_by_patience: {1: 1, 2: 2, 3: 3, 4: 4, 5: 6}
  seconds_by_patience: {1: 90, 2: 150, 3: 240, 4: 360, 5: 600}
  time_pressure_factor: 0.6      # budgets are multiplied by this under time pressure
frustration:
  threshold_by_patience: {1: 35, 2: 50, 3: 65, 4: 80, 5: 95}
  weights:
    error_seen: 10
    unexplained_error: 8         # added on top of error_seen when no cause or fix is shown
    no_change: 6                 # an action produced no visible change
    slow_load: 8                 # a load slower than browser.slow_load_seconds
    slow_load_per_second: 1.5
    no_loading_feedback: 6       # screen stayed frozen during a slow load
    repeat_action: 5
    backtrack: 4
    confusion: 8                 # multiplied by the 0..1 confusion level
    data_lost: 15                # previously entered data disappeared
    cannot_find: 7               # no visible control matches what the persona is looking for
    scroll_search: 2
  progress_relief: 4             # visible progress lowers frustration by this much
  mood_multiplier: {calm: 1.0, distracted: 1.15, stressed: 1.3}
elicitation:
  min_complaints_per_screen: 1
judge:
  max_rounds: 2                  # times a persona is sent back for specifics
  replay_hash_threshold: 12      # max perceptual-hash distance for "same screen"
novelty:
  max_familiarity: 2             # "unfamiliar" issues mainly affect personas at or below this
  min_share_low_familiarity: 0.75
prompt_notes: []                 # extra instructions added to persona prompts by calibration
