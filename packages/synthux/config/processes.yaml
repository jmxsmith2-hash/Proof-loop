# Manufacturing processes for `synthux physical check --process injection|cnc`.
# Figures are typical design-guide values (wall ranges, draft, shrinkage); your moulder's or
# machinist's numbers win. Lengths in mm, prices per kg of material.

injection:
  default_material: ABS
  min_draft_deg: 1.0            # side walls along the pull; textured surfaces need about 3°
  textured_draft_deg: 3.0
  cycle_overhead_s: 6           # fill, pack, open, eject
  materials:
    ABS:  {wall_mm: [1.2, 3.5], shrink_pct: 0.6, density_g_cm3: 1.04, price_per_kg: 2.6, cavity_mpa: 40, cool_s_per_mm2: 1.7}
    PP:   {wall_mm: [0.8, 3.8], shrink_pct: 1.6, density_g_cm3: 0.90, price_per_kg: 1.6, cavity_mpa: 30, cool_s_per_mm2: 1.9}
    PC:   {wall_mm: [1.0, 3.8], shrink_pct: 0.6, density_g_cm3: 1.20, price_per_kg: 3.5, cavity_mpa: 60, cool_s_per_mm2: 1.5}
    PA66: {wall_mm: [0.8, 3.0], shrink_pct: 1.5, density_g_cm3: 1.14, price_per_kg: 3.8, cavity_mpa: 50, cool_s_per_mm2: 1.4}
    POM:  {wall_mm: [0.8, 3.0], shrink_pct: 2.0, density_g_cm3: 1.41, price_per_kg: 3.0, cavity_mpa: 60, cool_s_per_mm2: 1.6}
    HDPE: {wall_mm: [0.8, 5.0], shrink_pct: 2.5, density_g_cm3: 0.95, price_per_kg: 1.6, cavity_mpa: 30, cool_s_per_mm2: 2.0}
    TPE:  {wall_mm: [0.5, 3.0], shrink_pct: 1.5, density_g_cm3: 1.10, price_per_kg: 4.0, cavity_mpa: 30, cool_s_per_mm2: 1.8}

cnc:
  default_material: aluminium_6061
  tool_mm: 3.0                  # usual small end mill; inside corners get its radius
  min_tool_mm: 1.0              # smallest practical end mill
  max_depth_per_width: 4        # pockets deeper than this times their width need long tools
  max_hole_depth_per_dia: 10
  materials:
    aluminium_6061: {min_wall_mm: 0.8, density_g_cm3: 2.70, price_per_kg: 6.0, removal_cm3_min: 15}
    aluminium_7075: {min_wall_mm: 0.8, density_g_cm3: 2.81, price_per_kg: 9.0, removal_cm3_min: 12}
    steel_1018:     {min_wall_mm: 1.0, density_g_cm3: 7.87, price_per_kg: 3.0, removal_cm3_min: 5}
    stainless_304:  {min_wall_mm: 1.0, density_g_cm3: 8.00, price_per_kg: 6.0, removal_cm3_min: 3}
    brass:          {min_wall_mm: 0.8, density_g_cm3: 8.50, price_per_kg: 10.0, removal_cm3_min: 15}
    POM:            {min_wall_mm: 1.5, density_g_cm3: 1.41, price_per_kg: 8.0, removal_cm3_min: 25}
    ABS:            {min_wall_mm: 1.5, density_g_cm3: 1.04, price_per_kg: 6.0, removal_cm3_min: 25}
