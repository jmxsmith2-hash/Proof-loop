[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthux"
version = "0.1.0"
description = "Synthetic user testing: personas that use your product like people would, with evidence, judging and calibration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6",
  "jinja2>=3.1",
  "numpy>=1.26",
  "pillow>=10",
  "typer>=0.12",
  "playwright>=1.40",
  "rapidocr-onnxruntime>=1.2",
  "trimesh>=4.0",
  "scipy>=1.11",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
step = ["cascadio>=0.0.13"]  # read STEP files directly (otherwise export STL/3MF/OBJ from your CAD tool)
# ClearLoop (FarmLoop auto-eject loop files): its checks run on loop files in `physical gcode`
clearloop = ["clearloop @ git+https://github.com/jmxsmith2-hash/proofloop#subdirectory=packages/clearloop"]
dev = ["pytest>=8"]

[project.scripts]
synthux = "synthux.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synthux = ["core/migrations/*.sql", "report/templates/*", "dashboard/templates/*", "prompts/*.md", "data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "browser: needs Chromium (Playwright)",
  "live: calls a paid model API; skipped unless SYNTHUX_LIVE=1",
  "e2e: full end-to-end run on the demo app (several minutes)",
]
