# ClearLoop farm configuration. Copy to config.yaml and edit.
# Every printer must be in LAN-only mode with Developer Mode on (docs/bambu-setup.md).

farm:
  name: My print farm
  data_dir: ./data                 # database, file library, reference images, diff images
  secret: change-me-to-something-long   # signs job manifests (tamper / stale-file detection)
  api_tokens:                      # leave empty only on a trusted, isolated network
    - { token: "replace-with-a-long-random-admin-token", role: admin, name: me }
    - { token: "replace-with-an-operator-token", role: operator, name: night shift }
  shopify_webhook_secret: null     # set to enable POST /api/orders/shopify

# Defaults for every printer; override per printer under `loop:`.
defaults:
  cooldown_mode: temperature       # wait for the bed to reach the release temperature (or "time")
  release_temp: null               # null = from the filament (PLA 30 C, ABS/ASA 40 C, PC 45 C ...)
  natural_cooldown_min: null       # null = automatic: ABS/ASA/PC/PA and heated-chamber jobs on enclosed printers
  bend_window_s: 25                # how long the printer waits while the bender works
  sweep:
    lane_spacing: 25               # mm between push lanes across a part
    push_ratio: 0.3                # push at 30 % of each part's height...
    max_push_z: 12                 # ...never higher than 12 mm
    final_wipe: false              # extra low passes over the whole plate after every job

verify:
  enabled: true                    # camera check that the plate is empty before every start
  roi: [0.15, 0.25, 0.85, 0.95]    # plate area in the camera image (x0, y0, x1, y1 as fractions)
  pixel_threshold: 38
  max_changed_fraction: 0.004
  min_blob_px: 30

quiet_hours:                       # optional
  start: "22:00"
  end: "07:00"
  mode: quiet                      # quiet = gentle bend profile; hold = no new jobs overnight

notifications:
  - { kind: ntfy, url: "https://ntfy.sh/your-private-topic", min_level: warning }
  # - { kind: discord, url: "https://discord.com/api/webhooks/...", min_level: error }
  # - { kind: webhook, url: "http://homeassistant.local:8123/api/webhook/clearloop" }

costs:
  currency: USD
  filament_per_kg: 20
  power_kw: 0.15
  kwh_price: 0.30
  machine_per_hour: 0.25
  plate_cost: 40                   # spread over the plate's rated cycles

printers:
  - name: p1s-01
    model: p1s                     # see `clearloop models`
    host: 192.168.1.50
    serial: "01P00A000000000"
    access_code: "12345678"
    ejector:
      kind: clearboard             # ClearBoard firmware over HTTP
      url: http://192.168.1.80
      token: null
    loop:
      door_opener: true
    plate: { type: textured_pei, rated_cycles: 1500 }
    max_retries: 1                 # recovery sweeps before asking for a human

  - name: a1-01
    model: a1
    host: 192.168.1.51
    serial: "03919A000000000"
    access_code: "87654321"
    ejector: { kind: gcode }       # tilt base + scraper, sweep only, no electronics

  - name: a1mini-swap
    model: a1mini
    host: 192.168.1.52
    serial: "0300AA000000000"
    access_code: "11223344"
    ejector:
      kind: custom                 # plate changer: insert the vendor's end G-code
      magazine_size: 10            # block and ask for a reload after 10 plates
      gcode: |
        ; paste your plate changer's swap G-code here
    verify: { enabled: true, roi: [0.1, 0.2, 0.9, 0.95] }

  - name: x1c-legacy-kit
    model: x1c
    host: 192.168.1.53
    serial: "00M00A000000000"
    access_code: "55667788"
    ejector:
      kind: custom                 # an existing switch-triggered bender kit in mechanical mode
      gcode: |
        ; move the bed down onto the kit's switch, then wait for its bend cycle
        G1 Z250 F900
        G4 S30

# Map shop SKUs to sliced files for order intake.
skus:
  - { sku: KEYCHAIN-RED, file: library/keychain_red.gcode.3mf, parts_per_plate: 12, models: [a1, p1s] }
