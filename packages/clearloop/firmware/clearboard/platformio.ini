; ClearBoard firmware: open ejector controller for ClearLoop.
; Build: pio run        Flash: pio run -t upload        Monitor: pio device monitor

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    knolleary/PubSubClient@2.8

[env:esp32-dev]
; Classic ESP32 boards work too; pick ADC1 pins in config.h if you change boards.
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    knolleary/PubSubClient@2.8
