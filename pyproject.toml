[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofloop"
version = "0.4.0"
description = "Check designs, make FarmLoop loop files and watch your Bambu Lab printers, in one app on your own computer"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ProofLoop contributors" }]
keywords = ["3d-printing", "bambu-lab", "p2s", "farmloop", "print-farm", "auto-eject", "cad", "g-code"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Printing",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
    "jinja2>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10",
    "trimesh>=4.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "paho-mqtt>=2.0",
    "cryptography>=42",  # the pretend printers' certificates (proofloop try)
    "qrcode>=7.4",                                                         # pairing a phone
    "pystray>=0.19; sys_platform == 'win32' or sys_platform == 'darwin'",  # the icon next to the clock
]

[project.optional-dependencies]
step = ["cascadio>=0.0.13"]  # read STEP files directly (otherwise export STL/3MF/OBJ from your CAD tool)
anthropic = ["anthropic>=2.3.0"]  # optional: Claude for personas and product predictions
all = ["proofloop[step]"]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "httpx>=0.28.1", "ruff>=0.17.3", "mypy>=2.4.0"]

[project.scripts]
proofloop = "proofloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proofloop = [
    "data/*",
    "core/migrations/*.sql", "core/theme.css",
    "app/static/*", "app/static/js/*", "app/templates/*",
    "check/templates/*",
    "loopfiles/profile_data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: the CAD examples end to end (slower)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Depends", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true

# Not type-checked yet: older numeric code (mostly values that may be missing). Take a module off this
# list once `mypy src` is clean for it; everything else is checked in CI.
[[tool.mypy.overrides]]
module = [
    "proofloop.check.cad.checks", "proofloop.check.cad.detail", "proofloop.check.cad.ergonomics",
    "proofloop.check.cad.manufacture", "proofloop.check.cad.threemf", "proofloop.check.evaluate",
    "proofloop.check.gcode.checks", "proofloop.check.gcode.parse", "proofloop.check.learn",
    "proofloop.check.sensors", "proofloop.loopfiles.importer", "proofloop.loopfiles.threemf",
    "proofloop.monitor.costing", "proofloop.monitor.filament", "proofloop.monitor.store",
    "proofloop.monitor.tracking", "proofloop.personas.design", "proofloop.personas.generate",
    "proofloop.personas.traits",
]
ignore_errors = true
