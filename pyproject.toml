[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proofloop"
version = "0.3.0"
description = "Check designs, make FarmLoop loop files and watch your Bambu Lab printers, in one app on your own computer"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "ProofLoop contributors" }]
keywords = ["3d-printing", "bambu-lab", "p2s", "farmloop", "print-farm", "auto-eject", "cad", "g-code"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Printing",
]
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6",
    "jinja2>=3.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10",
    "trimesh>=4.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "paho-mqtt>=2.0",
    "qrcode>=7.4",                                                         # pairing a phone
    "pystray>=0.19; sys_platform == 'win32' or sys_platform == 'darwin'",  # the icon next to the clock
]

[project.optional-dependencies]
step = ["cascadio>=0.0.13"]  # read STEP files directly (otherwise export STL/3MF/OBJ from your CAD tool)
anthropic = ["anthropic>=0.40"]  # optional: Claude for personas and product predictions
all = ["proofloop[step]"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4", "cryptography>=42"]  # cryptography: the pretend printer's certificate

[project.scripts]
proofloop = "proofloop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proofloop = [
    "data/*",
    "core/migrations/*.sql", "core/theme.css",
    "app/static/*", "app/templates/*",
    "check/templates/*",
    "loopfiles/profile_data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "e2e: the CAD examples end to end (slower)",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Header", "fastapi.Depends", "typer.Option", "typer.Argument"]
