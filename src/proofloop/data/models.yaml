# Model names and prices. Swap freely. Prices are USD per million tokens.
anthropic:
  roles:
    persona: claude-haiku-5-5     # persona writing and product predictions
  prices:
    claude-haiku-5-5: {input: 0.10, output: 0.50}
    claude-sonnet-5-5: {input: 2.00, output: 10.00}
    claude-opus-5-5: {input: 4.00, output: 20.00}
