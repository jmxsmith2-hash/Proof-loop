# ProofLoop's built-in advanced settings: which engine writes personas and product predictions.
# To change one, put just that setting in ~/.proofloop/config/settings.yaml: it is merged over this file.
# Values like ${NAME} or ${NAME:-default} are read from the environment (or ~/.proofloop/.env).
# Secrets must never be written here directly.

# data_dir: ...               # reports and the results database (default: ~/.proofloop)
log_level: INFO

engine:
  # "heuristic" runs entirely on this machine and costs nothing (no API key).
  # "ollama" uses a local model server. "anthropic" uses Claude (needs ANTHROPIC_API_KEY).
  default: heuristic
  roles: {}                    # e.g. {persona: anthropic}: Claude writes personas and product predictions
  batch: false                 # true = Claude answers through the Batches API: half price, answers in minutes
  batch_roles: []
