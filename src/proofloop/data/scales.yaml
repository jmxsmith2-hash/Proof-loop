# Anchored rating scales: every point has a concrete description.
ease:
  question: "How hard was it to get this step done?"
  points:
    1: "I could not do it, or I would have given up here."
    2: "I got it done only after several wrong tries or a long search."
    3: "I hesitated or made one wrong try, then got it."
    4: "I paused briefly to look, then did it."
    5: "I did it immediately without thinking about it."
clarity:
  question: "Did you understand what this screen wanted from you?"
  points:
    1: "I had no idea what to do or what went wrong."
    2: "I had to guess and my guess was partly wrong."
    3: "I understood after reading it twice."
    4: "Mostly clear; one label or message made me stop."
    5: "Completely clear on first look."
trust:
  question: "Would you enter your real details on this screen?"
  points:
    1: "No. Something here looks wrong or unsafe."
    2: "Only fake details."
    3: "Only the minimum required."
    4: "Yes, with a small doubt."
    5: "Yes, without hesitation."
price:
  question: "At this price, which would you actually do today?"
  choices: ["buy now", "compare with alternatives first", "come back later", "never buy"]
