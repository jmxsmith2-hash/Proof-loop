# Ground truth for the second demo site (demo_app/pinecone.py, studies/pinecone.yaml).
# A promoted finding matches a flaw when its tasks overlap, and its category and screen are listed.
flaws:
  - id: recurring_popup
    description: the newsletter pop-up comes back on every page after it was closed
    tasks: [returns, store_hours, contact_email]
    screens: ["/help", "/help/orders", "/help/orders/returns", "/contact", "/shop", "/"]
    categories: [popup_interruption]
  - id: buried_returns
    description: the return policy is three levels deep (Help -> Orders & delivery -> Returns) with no direct link
    tasks: [returns]
    screens: ["/help/orders/returns", "/help/orders"]
    categories: [deep_navigation]
  - id: dead_stores_link
    description: the "Stores" menu link does nothing
    tasks: [store_hours]
    screens: ["/", "/help", "/contact", "/shop"]
    categories: [dead_click]
controls:
  description: >-
    clean on purpose: the cookie banner closes and stays closed, the sign-up form has labels, a dropdown and
    a terms checkbox; any promoted finding on the register task or about the cookie banner is a false positive
  tasks: [register]
  forbidden_text: ["cookie banner"]
